<meta http-equiv="refresh" content="666; url=../about_/index.html">

<html>

<head>
  <title>between timing jitter</title>
</head>

<body>
<br>
  <p>ちょっと待って</p>
  <!-- 45" -->
  <input type="checkbox" id="start45">
  <!-- 11' -->
  <input type="checkbox" id="start11">
  <!-- Sama Vritti Pranayama -->
  <input type="checkbox" id="samavritti">
  <br>
    <br>
      <br>
        <br>
    <br>
      <br>
  <div class="timeme"></div>

  <style>
    .timeme {
      width:0;
      height:11vw;
      background: black;
      border-radius: 100px;
    }

    #start45:checked~.timeme {
      animation: timer 45s linear forwards;
    }

    #start11:checked~.timeme {
      animation: timer 666s linear forwards;
    }

    #samavritti:checked~.timeme {
      animation: timer 9s infinite;
    }

    @keyframes timer {
      from {
        width: 98vw;
      }

      to {
        width: 11vw;
        background: white;
      }
    }
    
   	form {
    width: 98vw; /* 150% of viewport width */
  }
     	button {
    width: 98vw; /* 150% of viewport width */
  }
       	p {
    font-size: 13vw;
  }
         	input {
    width: 18vw;
    height: 18vw;
  }
  
  input[type="checkbox"] {
    position: relative;
    width: 3vw;
    height: 3vw;
    cursor: pointer;
    z-index: 3;
    appearance: none;
    border: 10px solid whitw;
    border-radius: 100px;
    background: black;
    margin: 20px;
  }

  </style>
</body>
</html>
